<div class="header">
  <h2>Update Profile</h2>
</div>
<div class="page">
  <div class="container">

    <div class="card">

      <form #profileForm="ngForm">

        <!-- NAME -->
        <div class="input-group">
          <label>Name</label>
          <input
            type="text"
            name="name"
            [(ngModel)]="customerDetails.name"
            placeholder="Enter your name"
            #name
          />
        </div>

        <!-- EMAIL -->
        <div class="input-group">
          <label>Email</label>
          <input
            type="email"
            name="email"
            [(ngModel)]="customerDetails.email"
            placeholder="Enter your email"
            #email
          />
        </div>

        <!-- PHONE -->
        <div class="input-group">
          <label>Phone</label>
          <input
            type="text"
            name="phone"
            [(ngModel)]="customerDetails.phone"
            placeholder="Enter your phone"
            #phone
          />
        </div>

        <!-- AGE -->
        <div class="input-group">
          <label>Age</label>
          <input
            type="number"
            name="age"
            [(ngModel)]="customerDetails.age"
            #age
            placeholder="Enter your age"
          />
        </div>

        <!-- ADDRESS -->
        <div class="input-group">
          <label>Address</label>
          <textarea
            rows="3"
            name="address"
            [(ngModel)]="customerDetails.address"
            placeholder="Enter your address"
            #address
          ></textarea>
        </div>

        <!-- IMAGE -->
        <div class="input-group">
          <label>Choose Profile Image</label>

          <input
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
          />
        </div>

        <!-- ACTIONS -->
        <div class="actions">
          <button
            type="button"
            class="btn save"
            (click)="onSave(name.value,email.value,phone.value,age.value,address.value)"
          >
            💾 Save Changes
          </button>

          <button
            type="button"
            class="btn cancel"
            (click)="onBack()"
          >
            ↩ Back
          </button>
        </div>

      </form>
      <div class="not-found-wrapper" *ngIf="massage_ar != '' || massage_en != ''">
        <div class="msg-card en-card">
          <span>{{ massage_en }}</span>
        </div>
        <div class="msg-card ar-card">
          <span>{{ massage_ar }}</span>
        </div>
      </div>
    </div>

  </div>

</div>
