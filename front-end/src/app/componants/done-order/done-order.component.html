<div class="track-container">

  <div class="track-card">

    <h1>Track Your Order</h1>

    <p class="subtitle">
      Enter your table number to track your order
    </p>

    <form>

      <div class="input-group">

        <label>Table Number</label>

        <input
          type="number"
          placeholder="Enter table number"
          name="tableNumber"
        />

      </div>

      <button type="submit">
        Confirm
      </button>

    </form>

  </div>

</div>
